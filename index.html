<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Fibonacci-based anagram puzzle game">
    <meta name="theme-color" content="#000000">
    <title>Magrana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<header>
    <div class="header-top">
        <img src="icon.png" alt="Magrana" class="app-icon">
        <div class="header-info">
            <div class="stats">
                <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span id="lbl-found">0</span> / <span id="lbl-req" style="color:var(--accent)">0</span>
                <span style="font-size:0.8em; opacity:0.6">(<span id="lbl-total">0</span>)</span>
            </div>
            <div class="meta-info">Level <span id="lbl-level">1</span></div>
        </div>
    </div>
    <div class="progress-container"><div id="progress" class="progress-bar"></div></div>
</header>

<div id="board">
    <div id="zone-target" class="zone target"></div>
    <div id="zone-pool" class="zone pool"></div>
</div>

<div id="found-words"></div>
<button id="btn-next" onclick="game.nextLevel()" style="display:none">Next Level >></button>

<script src="game.js"></script>
</body>
</html>
